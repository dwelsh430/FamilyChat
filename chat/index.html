<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6f5e">
<title>Family Chat</title>
<style>
  :root {
    --bg: #f6f4ef;
    --panel: #ffffff;
    --ink: #1f2421;
    --muted: #6b716d;
    --line: #e3e0d8;
    --accent: #2f6f5e;
    --accent-ink: #ffffff;
    --mine: #dcefe7;
    --theirs: #ffffff;
    --warn: #9a5b00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151816;
      --panel: #1e2320;
      --ink: #e9ece9;
      --muted: #9aa29d;
      --line: #2e3531;
      --accent: #5fb39a;
      --accent-ink: #0f1311;
      --mine: #23392f;
      --theirs: #232825;
      --warn: #e0a64a;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding: 10px 16px;
    padding-top: max(10px, env(safe-area-inset-top));
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header h1 { font-size: 18px; margin: 0; flex: 1; }
  #status { font-size: 13px; color: var(--muted); text-align: right; }
  #status .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted); margin-right: 6px; vertical-align: middle;
  }
  #status.online .dot { background: #3bb273; }
  button {
    font: inherit;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    border-radius: 10px;
    padding: 8px 12px;
    cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  #menuBtn { padding: 6px 10px; }
  nav.tabs {
    display: flex;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  nav.tabs button {
    flex: 1; border: 0; border-radius: 0; background: none;
    padding: 10px 8px; color: var(--muted); font-weight: 600;
    border-bottom: 3px solid transparent;
  }
  nav.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  nav.tabs button.has-new::after {
    content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); margin-left: 6px; vertical-align: middle;
  }
  body[data-tab="grocery"] #messages, body[data-tab="grocery"] footer { display: none; }
  body:not([data-tab="grocery"]) #groceryBoard { display: none; }
  /* Grocery Store board */
  #groceryBoard {
    flex: 1; overflow-y: auto; padding: 16px;
    padding-bottom: max(16px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 12px;
  }
  #groceryBoard > * { width: 100%; max-width: 640px; margin-left: auto; margin-right: auto; }
  .g-add { display: flex; gap: 8px; }
  .g-add input, .g-edit {
    flex: 1; min-width: 0; font: inherit; padding: 8px 12px;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--bg); color: var(--ink);
  }
  .g-store {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 12px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .g-store-head { display: flex; align-items: center; gap: 8px; }
  .g-name {
    border: 0; background: none; padding: 4px 2px; text-align: left;
    flex: 1; min-width: 0; overflow-wrap: anywhere; border-radius: 6px;
  }
  .g-name:hover { background: var(--bg); }
  .g-store-name { font-size: 18px; font-weight: 700; }
  .g-count { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .g-x {
    border: 0; background: none; color: var(--muted);
    font-size: 22px; line-height: 1; padding: 4px 8px;
  }
  .g-x:hover { color: var(--ink); }
  .g-items { list-style: none; margin: 0; padding: 0; }
  .g-item {
    display: flex; align-items: center; gap: 8px;
    padding: 2px 0; border-top: 1px solid var(--line);
  }
  .g-item:first-child { border-top: 0; }
  .g-item input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
  .g-item.done .g-item-name { text-decoration: line-through; color: var(--muted); }
  .g-clear { align-self: flex-start; font-size: 14px; padding: 6px 10px; }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .day {
    align-self: center; font-size: 12px; color: var(--muted);
    margin: 10px 0 4px;
  }
  .msg {
    max-width: min(80%, 560px);
    padding: 8px 12px;
    border-radius: 14px;
    background: var(--theirs);
    border: 1px solid var(--line);
    align-self: flex-start;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
  }
  .msg.mine { background: var(--mine); align-self: flex-end; }
  .msg .who { font-size: 12px; font-weight: 600; color: var(--accent); margin-bottom: 2px; }
  .msg .time { font-size: 11px; color: var(--muted); margin-top: 2px; text-align: right; }
  .empty { margin: auto; color: var(--muted); text-align: center; max-width: 320px; }
  footer {
    background: var(--panel);
    border-top: 1px solid var(--line);
    padding: 10px 16px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    display: flex;
    gap: 8px;
  }
  textarea {
    flex: 1;
    font: inherit;
    resize: none;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 9px 12px;
    background: var(--bg);
    color: var(--ink);
    max-height: 140px;
  }
  /* Setup + menu overlays */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.35);
    display: none;
    align-items: center; justify-content: center;
    padding: 16px;
    z-index: 10;
  }
  .overlay.show { display: flex; }
  .card {
    background: var(--panel);
    border-radius: 16px;
    padding: 20px;
    width: 100%;
    max-width: 420px;
    max-height: 100%;
    overflow-y: auto;
  }
  .card h2 { margin: 0 0 6px; font-size: 20px; }
  .card p { color: var(--muted); margin: 6px 0 14px; font-size: 14px; }
  .card label { display: block; font-size: 14px; font-weight: 600; margin: 12px 0 4px; }
  .card input {
    width: 100%; font: inherit; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--bg); color: var(--ink);
  }
  .card .row { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .card .row button { flex: 1; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .peers { font-size: 14px; margin: 4px 0 0; padding-left: 18px; }
  #toast {
    position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
    background: var(--ink); color: var(--bg);
    padding: 8px 14px; border-radius: 10px; font-size: 14px;
    opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>Family Chat</h1>
  <div id="status"><span class="dot"></span><span id="statusText">Starting…</span></div>
  <button id="menuBtn" aria-label="Menu">☰</button>
</header>

<nav class="tabs" role="tablist">
  <button id="tabChat" role="tab" aria-selected="true">Chat</button>
  <button id="tabGrocery" role="tab" aria-selected="false">Grocery Store</button>
</nav>

<main id="messages"></main>

<section id="groceryBoard" aria-label="Grocery Store"></section>

<footer>
  <textarea id="input" rows="1" placeholder="Write a message…" aria-label="Message"></textarea>
  <button id="sendBtn" class="primary">Send</button>
</footer>

<!-- First-time setup -->
<div class="overlay" id="setup">
  <div class="card">
    <h2>Welcome to Family Chat</h2>
    <p>Messages go straight between family members' devices. Each device keeps its own copy of the chat.</p>
    <label for="nameInput">Your name</label>
    <input id="nameInput" maxlength="40" placeholder="e.g. Grandma" autocomplete="nickname">
    <label for="codeInput">Family code</label>
    <input id="codeInput" maxlength="80" placeholder="Shared secret everyone in the family uses" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="hint">Everyone must type the same code. Treat it like a password: anyone who has it can join.</div>
    <div class="row">
      <button id="genCode">Make a new code</button>
      <button id="joinBtn" class="primary">Join chat</button>
    </div>
  </div>
</div>

<!-- Menu -->
<div class="overlay" id="menu">
  <div class="card">
    <h2>Family Chat</h2>
    <p id="menuInfo"></p>
    <label>Connected right now</label>
    <ul class="peers" id="peerList"></ul>
    <div class="row">
      <button id="inviteBtn" class="primary">Copy invite link</button>
    </div>
    <div class="row">
      <button id="renameBtn">Change my name</button>
      <button id="exportBtn">Save a backup</button>
    </div>
    <div class="row">
      <button id="leaveBtn">Switch family code</button>
      <button id="closeMenu">Close</button>
    </div>
  </div>
</div>

<div id="toast"></div>
